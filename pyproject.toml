[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lvren-jev"
dynamic = ["version"]
description = "Business-neutral semantic decision runtime for TypeSafe Jev"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "PyYAML>=6.0",
  "typesafe-sdk>=0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.dynamic]
version = {attr = "lvren_jev._version.__version__"}
