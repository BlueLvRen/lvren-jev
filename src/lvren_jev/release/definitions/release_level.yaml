version: 1
kind: classifier
name: release_decision
input:
  type: text
  field: evidence
  instructions: >-
    Based only on the commit body and actual diff, choose the highest-impact
    semantic version level for this change. PATCH is a backward-compatible fix,
    MINOR is a backward-compatible new capability, and MAJOR is an incompatible
    API or configuration change. Do not rely on commit type or file name alone.
categories:
  patch:
    label: PATCH
    description: Backward-compatible bug fix, documentation, or packaging-only correction.
  minor:
    label: MINOR
    description: Backward-compatible new public capability or behavior.
  major:
    label: MAJOR
    description: Incompatible public API or configuration change.
policy:
  threshold: 0.75
  fallback:
    value: pending_review
    label: 需要人工复核
