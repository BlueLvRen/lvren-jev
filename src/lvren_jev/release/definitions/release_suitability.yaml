version: 1
kind: classifier
name: release_decision
input:
  type: text
  field: evidence
  instructions: >-
    Judge whether the cumulative software changes are sufficiently described by
    the commit bodies and actual diffs to be packaged and released. Choose
    publish only when the evidence shows a coherent, testable release; choose
    reject for changes that should not be released as a package. Do not infer
    from commit prefixes or file names alone.
categories:
  publish:
    label: 适合发布
    description: The cumulative changes are coherent and suitable for a package release.
  reject:
    label: 不适合发布
    description: The cumulative changes should not be packaged and released now.
policy:
  threshold: 0.75
  fallback:
    value: pending_review
    label: 需要人工复核
